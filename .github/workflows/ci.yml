name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # The tests are pure Node; Electron's ~100MB binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests + alpha assertions
        run: npm test

      - name: Cutout diagnostic (synthetic fixture + GT, no model)
        run: >
          node tools/cutout-diag.js
          --fake tools/fixtures/synthetic-portrait.png
          --mask tools/fixtures/synthetic-portrait-mask.png
          --assert