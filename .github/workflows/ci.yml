name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # The tests are pure Node; Electron's ~100MB binary is not needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Accessibility regression (static)
        run: node tools/check-a11y.js

      - name: Unit tests + alpha assertions
        run: npm test

      - name: Cutout diagnostic (synthetic fixture + GT, no model)
        run: npm run diag:fixtures

      - name: Real model on synthetic fixture (alpha metrics)
        run: node tools/cutout-diag.js --input tools/fixtures/synthetic-portrait.png --assert

      - name: Real model on a no-person image (must report NO_PERSON)
        run: node tools/cutout-diag.js --input tools/fixtures/negative-landscape.png --expect no-person

  # 真窗口 e2e：起一个真实的 Electron（headless 会话，不需要 xvfb），
  # 用 CDP 点宠物 / 开气泡 / 找城市。失败直接变红。
  e2e:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 注意：这里不能设 ELECTRON_SKIP_BINARY_DOWNLOAD，e2e 要真的 Electron 可执行文件。
      - name: Install
        run: npm ci

      - name: Headless Electron e2e (noresize / collapse / city)
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
        env:
          DESKPET_E2E_PORT: '9333'
          # 失败时别删临时数据目录：下面的注解步骤要读 app.log
          DESKPET_E2E_KEEP: '1'

      # 失败信息进 check-run 注解：公开仓库免登录就能查到（job 日志要鉴权）。
      - name: Surface e2e failures as annotations
        if: failure()
        shell: bash
        run: node tools/e2e/annotate.js e2e.log

      - name: Upload e2e data dir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-data
          path: .e2e-data/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3