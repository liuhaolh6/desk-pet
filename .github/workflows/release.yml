name: Release

# 推送 v* tag 时构建 Windows portable 产物，并创建（或补传）GitHub Release。
# 用 Actions 自带的 GITHUB_TOKEN，不需要额外 secret；签名流程见 sign-release.yml。
#
# 注意：electron-builder 默认下载的 NSIS 是 32 位 makensis，对 ~170MB 的 portable
# 载荷会以 "Internal compiler error #12345: error creating mmap" 失败。这里改用
# negrutiu 的 64 位 NSIS 构建，并把 elevate.exe 放在同一个目录（见 M6-PACKAGING.md）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（例如 v0.5.8），用于手动重跑发布'
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NSIS_AMD64_VERSION: 'v3.13.7507.353'
  NSIS_AMD64_ASSET: 'nsis-3.13.7507.353-negrutiu-amd64.exe'
  NSIS_BUNDLE_URL: 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis%401.2.1/nsis-bundle-3.12.tar.gz'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache 64-bit NSIS
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\nsis64
          key: nsis-amd64-${{ env.NSIS_AMD64_VERSION }}-elevate-1

      - name: Prepare 64-bit NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path $env:RUNNER_TEMP 'nsis64'
          if (-not (Test-Path (Join-Path $nsis 'Bin\makensis.exe'))) {
            Write-Host 'downloading 64-bit NSIS...'
            $work = Join-Path $env:RUNNER_TEMP 'nsis-dl'
            New-Item -ItemType Directory -Force -Path $nsis, $work | Out-Null
            $setup = Join-Path $work 'nsis-amd64.exe'
            Invoke-WebRequest "https://github.com/negrutiu/nsis/releases/download/$env:NSIS_AMD64_VERSION/$env:NSIS_AMD64_ASSET" -OutFile $setup
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
            & $sevenZip x $setup "-o$nsis" -y | Out-Null
            $bundle = Join-Path $work 'nsis-bundle.tar.gz'
            Invoke-WebRequest $env:NSIS_BUNDLE_URL -OutFile $bundle
            tar -xzf $bundle -C $work nsis-bundle/elevate.exe
            Copy-Item (Join-Path $work 'nsis-bundle\elevate.exe') (Join-Path $nsis 'elevate.exe') -Force
            # electron-builder 的插件是 x86-unicode，显式指定目标架构。
            Add-Content (Join-Path $nsis 'nsisconf.nsh') "`nTarget x86-unicode"
            $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
            Write-Host "NSIS installer sha256: $hash"
          } else {
            Write-Host 'using cached 64-bit NSIS'
          }
          if (-not (Test-Path (Join-Path $nsis 'Bin\makensis.exe'))) { throw 'Bin\makensis.exe missing' }
          if (-not (Test-Path (Join-Path $nsis 'elevate.exe'))) { throw 'elevate.exe missing' }
          "ELECTRON_BUILDER_NSIS_DIR=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $nsis 'Bin\makensis.exe') /VERSION

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Accessibility regression (static)
        run: node tools/check-a11y.js

      - name: Build portable
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum DeskPet-*-portable.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify artifact version
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\DeskPet-*-portable.exe | Select-Object -First 1
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          if ($exe.Name -notlike "*$expected*") { throw "artifact $($exe.Name) does not match package version $expected" }
          Write-Host "artifact: $($exe.Name) $($exe.Length) bytes"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/DeskPet-*-portable.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/DeskPet-*-portable.exe dist/SHA256SUMS.txt \
              --title "$tag" --generate-notes
          fi

      # 失败时把构建日志尾部落到一个 Issue 里：无需登录也能看到失败原因。
      - name: Report failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $title = "[CI] Release build failed for $tag"
          $existing = gh issue list --state open --search "$title in:title" --json number --jq 'length'
          if ([int]$existing -gt 0) { Write-Host 'failure issue already open'; exit 0 }
          $log = Join-Path $env:RUNNER_TEMP 'build.log'
          $tail = if (Test-Path $log) { (Get-Content $log -Tail 60) -join [Environment]::NewLine } else { 'build.log not found' }
          $fence = '```'
          $lines = @(
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            '',
            $fence,
            $tail,
            $fence
          )
          $lines -join [Environment]::NewLine | Out-File -FilePath "$env:RUNNER_TEMP\issue-body.md" -Encoding utf8
          gh issue create --title $title --body-file "$env:RUNNER_TEMP\issue-body.md"