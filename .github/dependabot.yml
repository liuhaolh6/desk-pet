version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Electron 与 onnxruntime 升级需要真机验证，单独成 PR 更安全。
      dev-tooling:
        patterns:
          - 'electron-builder'
          - 'eslint*'
          - 'prettier*'
    ignore:
      # 原生依赖与主运行时保持手动升级（需要重新打包与真机验证）。
      - dependency-name: electron
      - dependency-name: onnxruntime-node
      - dependency-name: onnxruntime-common

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Shanghai
    commit-message:
      prefix: 'chore(ci)'