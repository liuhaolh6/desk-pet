<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌宠</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="bubble" aria-live="polite">
      <svg class="bubble-shape" viewBox="0 0 1026 700" preserveAspectRatio="none" aria-hidden="true">
        <g transform="translate(592.65 0) scale(1.35 1) translate(-513 0)">
          <path class="bubble-bshape" fill="#FFFFFF" stroke="#203170" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" d="M 827 248 A 373 232 0 1 0 81 246 A 373 232 0 0 0 301 465 A 57 32 10 0 0 413 484 A 373 232 0 0 0 827 248 Z"/>
          <ellipse class="bubble-b1" cx="352" cy="561" rx="37.5" ry="26" fill="#FFFFFF" stroke="#203170" stroke-width="18"/>
          <ellipse class="bubble-b2" cx="442" cy="646" rx="24.5" ry="18" fill="#FFFFFF" stroke="#203170" stroke-width="18"/>
        </g>
      </svg>
      <div id="bubbleContent" class="bubble-content"></div>
    </div>
    <div id="petWrap" class="pet-wrap">
      <div id="petFlip" class="pet-flip">
        <img id="pet" alt="桌宠" draggable="false">
      </div>
      <button id="menuBtn" class="menu-btn" type="button" aria-label="打开菜单" title="菜单">
        <span></span><span></span><span></span>
      </button>
      <div id="petMenu" class="pet-menu" role="menu" aria-label="桌宠菜单" hidden>
        <button type="button" role="menuitem" data-action="settings">设置</button>
        <button type="button" role="menuitem" data-action="editor">布置气泡</button>
        <button type="button" role="menuitem" data-action="weather">看看天气</button>
        <div class="pet-menu-sep" role="separator"></div>
        <button type="button" role="menuitem" data-action="hide">先藏起来</button>
        <button type="button" role="menuitem" data-action="quit" class="danger">先退出啦</button>
      </div>
    </div>
  </div>
  <script src="bubble-model.js"></script>
  <script src="sound-model.js"></script>
  <script src="pet.js"></script>
</body>
</html>
