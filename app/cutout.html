<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从照片生成角色</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="cutout.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>从照片生成角色</h1>
      <p>离线抠图，照片不会上传</p>
    </div>
    <button id="closeBtn" class="ghost compact" type="button">关闭</button>
  </header>

  <main class="layout">
    <section class="stage-card">
      <div id="stage" class="stage" tabindex="0" aria-label="角色预览" aria-describedby="previewAlt">
        <canvas id="canvas" width="610" height="610"></canvas>
        <div id="empty" class="empty">
          <strong>选择一张人像照片</strong>
          <span>支持 JPG / PNG / WebP，自动抠出人像</span>
        </div>
      </div>
      <p id="previewAlt" class="sr-only" aria-live="polite">尚未选择照片</p>
      <div id="viewRow" class="view-row" hidden>
        <div class="seg-group" role="group" aria-label="看看什么样">
          <button type="button" class="seg is-on" data-view="result" aria-pressed="true">结果</button>
          <button type="button" class="seg" data-view="original" aria-pressed="false">原图</button>
          <button id="maskViewBtn" type="button" class="seg" data-view="mask" aria-pressed="false" hidden>蒙版</button>
        </div>
      </div>
      <div class="stage-tools">
        <span id="modeLabel" class="pill">等待照片</span>
        <button id="resetBtn" class="ghost compact" type="button">重置位置</button>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>1. 选择照片</h2>
        <button id="pickBtn" class="primary" type="button">选择照片</button>
        <button id="runBtn" class="ghost" type="button" disabled>开始抠图</button>
        <label class="field" for="name">
          <span>角色名</span>
          <input id="name" type="text" maxlength="30" placeholder="照片角色">
        </label>
        <p id="status" class="status" role="status">选择照片后会在这里显示进度。</p>
      </section>

      <section class="card">
        <h2>2. 调整构图</h2>
        <label class="range" for="zoom">
          <span>缩放 <em id="zoomVal">100%</em></span>
          <input id="zoom" type="range" min="60" max="160" value="100">
        </label>
        <p class="hint">拖动画面调整位置，滚轮可以缩放。</p>
        <div class="chip-row" role="group" aria-label="转一转">
          <button id="rotateLeftBtn" class="ghost compact" type="button" title="往左转" aria-keyshortcuts="Q">↺ 左转</button>
          <button id="rotateRightBtn" class="ghost compact" type="button" title="往右转" aria-keyshortcuts="W">↻ 右转</button>
          <button id="flipBtn" class="ghost compact" type="button" title="照镜子" aria-pressed="false" aria-keyshortcuts="F">⇋ 翻转</button>
        </div>
        <div class="button-row">
          <button id="fallbackBtn" class="ghost" type="button" disabled>仅缩放导入</button>
          <button id="saveBtn" class="primary" type="button" disabled>保存为角色</button>
        </div>
      </section>

      <section class="card" id="editCard" hidden>
        <h2>3. 修补边缘</h2>
        <div class="chip-row" role="group" aria-label="修一修">
          <button id="eraseBtn" class="ghost compact" type="button" aria-pressed="false" aria-keyshortcuts="E">擦除</button>
          <button id="restoreBtn" class="ghost compact" type="button" aria-pressed="false" aria-keyshortcuts="R">恢复</button>
          <button id="undoBtn" class="ghost compact" type="button" disabled aria-keyshortcuts="Control+Z">撤销</button>
          <button id="resetEditBtn" class="ghost compact" type="button" disabled>重置</button>
        </div>
        <label class="range" for="brush">
          <span>笔刷 <em id="brushVal">24px</em></span>
          <input id="brush" type="range" min="8" max="80" value="24" aria-label="笔刷大小（8 到 80 像素）">
        </label>
        <p class="hint">E 擦除 / R 恢复 / [ ] 笔刷 / Ctrl+Z 撤销；Q / W 旋转、F 翻转；编辑时暂停拖动。</p>
      </section>

      <p class="privacy">照片和角色图都只写在本机数据目录；抠图模型已随应用离线打包。</p>
    </aside>
  </main>

  <script src="cutout.js"></script>
</body>
</html>
