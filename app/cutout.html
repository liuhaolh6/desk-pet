<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="window.cutout"></title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="cutout.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 data-i18n="window.cutout"></h1>
      <p data-i18n="cutout.subtitle"></p>
    </div>
    <button id="closeBtn" class="ghost compact" type="button" data-i18n="cutout.close"></button>
  </header>

  <main class="layout">
    <section class="stage-card">
      <div id="stage" class="stage" tabindex="0" data-i18n-aria-label="cutout.stage.label" aria-describedby="previewAlt">
        <canvas id="canvas" width="610" height="610"></canvas>
        <div id="empty" class="empty">
          <strong data-i18n="cutout.empty.title"></strong>
          <span data-i18n="cutout.empty.hint"></span>
        </div>
      </div>
      <p id="previewAlt" class="sr-only" aria-live="polite" data-i18n="cutout.preview.empty"></p>
      <div id="viewRow" class="view-row" hidden>
        <div class="seg-group" role="group" data-i18n-aria-label="cutout.view.group">
          <button type="button" class="seg is-on" data-view="result" aria-pressed="true" data-i18n="cutout.view.result"></button>
          <button type="button" class="seg" data-view="original" aria-pressed="false" data-i18n="cutout.view.original"></button>
          <button id="maskViewBtn" type="button" class="seg" data-view="mask" aria-pressed="false" hidden data-i18n="cutout.view.mask"></button>
        </div>
      </div>
      <div class="stage-tools">
        <span id="modeLabel" class="pill" data-i18n="cutout.mode.none"></span>
        <button id="resetBtn" class="ghost compact" type="button" data-i18n="cutout.resetView"></button>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <h2 data-i18n="cutout.step.pick"></h2>
        <button id="pickBtn" class="primary" type="button" data-i18n="cutout.pickBtn"></button>
        <button id="runBtn" class="ghost" type="button" disabled data-i18n="cutout.runBtn"></button>
        <label class="field" for="name">
          <span data-i18n="cutout.nameLabel"></span>
          <input id="name" type="text" maxlength="30" data-i18n-placeholder="cutout.defaultName">
        </label>
        <p id="status" class="status" role="status" data-i18n="cutout.status.idle"></p>
      </section>

      <section class="card">
        <h2 data-i18n="cutout.step.place"></h2>
        <label class="range" for="zoom">
          <span><span data-i18n="cutout.zoomLabel"></span> <em id="zoomVal">100%</em></span>
          <input id="zoom" type="range" min="60" max="160" value="100">
        </label>
        <p class="hint" data-i18n="cutout.zoomHint"></p>
        <div class="chip-row" role="group" data-i18n-aria-label="cutout.rotate.group">
          <button id="rotateLeftBtn" class="ghost compact" type="button" data-i18n="cutout.rotate.left" data-i18n-title="cutout.rotate.leftTitle" aria-keyshortcuts="Q"></button>
          <button id="rotateRightBtn" class="ghost compact" type="button" data-i18n="cutout.rotate.right" data-i18n-title="cutout.rotate.rightTitle" aria-keyshortcuts="W"></button>
          <button id="flipBtn" class="ghost compact" type="button" data-i18n="cutout.rotate.flip" data-i18n-title="cutout.rotate.flipTitle" aria-pressed="false" aria-keyshortcuts="F"></button>
        </div>
        <div class="button-row">
          <button id="fallbackBtn" class="ghost" type="button" disabled data-i18n="cutout.fallbackBtn"></button>
          <button id="saveBtn" class="primary" type="button" disabled data-i18n="cutout.saveBtn"></button>
        </div>
      </section>

      <section class="card" id="editCard" hidden>
        <h2 data-i18n="cutout.step.edit"></h2>
        <div class="chip-row" role="group" data-i18n-aria-label="cutout.edit.group">
          <button id="eraseBtn" class="ghost compact" type="button" aria-pressed="false" aria-keyshortcuts="E" data-i18n="cutout.erase"></button>
          <button id="restoreBtn" class="ghost compact" type="button" aria-pressed="false" aria-keyshortcuts="R" data-i18n="cutout.restore"></button>
          <button id="undoBtn" class="ghost compact" type="button" disabled aria-keyshortcuts="Control+Z" data-i18n="cutout.undo"></button>
          <button id="resetEditBtn" class="ghost compact" type="button" disabled data-i18n="cutout.resetEdit"></button>
        </div>
        <label class="range" for="brush">
          <span><span data-i18n="cutout.brushLabel"></span> <em id="brushVal">24px</em></span>
          <input id="brush" type="range" min="8" max="80" value="24" data-i18n-aria-label="cutout.brushAria">
        </label>
        <p class="hint" data-i18n="cutout.editHint"></p>
      </section>

      <p class="privacy" data-i18n="cutout.privacy"></p>
    </aside>
  </main>

  <script src="i18n.js"></script>
  <script src="cutout.js"></script>
</body>
</html>
