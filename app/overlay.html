<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌宠气泡</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="bubble" class="bubble" aria-live="polite">
    <svg class="bubble-shape" viewBox="0 0 1026 700" aria-hidden="true">
      <g transform="translate(592.65 0) scale(1.35 1) translate(-513 0)">
        <path class="bubble-bshape" fill="#FFFFFF" stroke="#203170" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" d="M 827 248 A 373 232 0 1 0 81 246 A 373 232 0 0 0 301 465 A 57 32 10 0 0 413 484 A 373 232 0 0 0 827 248 Z"/>
        <ellipse class="bubble-b1" cx="352" cy="561" rx="37.5" ry="26" fill="#FFFFFF" stroke="#203170" stroke-width="18"/>
        <ellipse class="bubble-b2" cx="442" cy="646" rx="24.5" ry="18" fill="#FFFFFF" stroke="#203170" stroke-width="18"/>
      </g>
    </svg>
    <div id="bubbleContent" class="bubble-content"></div>
  </div>
  <!-- P2-4 stage 2：悬停菜单也放在这个窗口里。窗口按菜单尺寸单独开，
       不再挤在桌宠窗口里，所以既不会被窗口剪掉，桌宠窗口也不用跟着变。 -->
  <div id="petMenu" class="pet-menu" role="menu" data-i18n-aria-label="pet.menu.label" hidden>
    <button type="button" role="menuitem" data-action="settings" data-i18n="pet.menu.settings"></button>
    <button type="button" role="menuitem" data-action="editor" data-i18n="pet.menu.editor"></button>
    <button type="button" role="menuitem" data-action="weather" data-i18n="pet.menu.weather"></button>
    <div class="pet-menu-sep" role="separator"></div>
    <button type="button" role="menuitem" data-action="hide" data-i18n="pet.menu.hide"></button>
    <button type="button" role="menuitem" data-action="quit" class="danger" data-i18n="pet.menu.quit"></button>
  </div>
  <script src="i18n.js"></script>
  <script src="overlay.js"></script>
  <script src="theme-boot.js"></script>
</body>
</html>
