<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title data-i18n="editor.title"></title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <h1 data-i18n="editor.title"></h1>
    <div id="tabs" class="tabs"></div>
    <span class="spacer"></span>
    <button id="resetBtn" type="button" data-i18n="editor.reset"></button>
    <button id="saveBtn" class="primary" type="button" data-i18n="editor.save"></button>
    <button id="closeBtn" type="button" data-i18n="editor.close"></button>
  </header>

  <div class="body">
    <section class="canvas">
      <div class="presets" role="group" aria-label="一键排版" data-i18n-aria-label="editor.presetsAria">
        <span class="presets-label" data-i18n="editor.presetsLabel"></span>
        <button type="button" data-preset="simple" data-i18n="editor.preset.simple"></button>
        <button type="button" data-preset="standard" data-i18n="editor.preset.standard"></button>
        <button type="button" data-preset="rich" data-i18n="editor.preset.rich"></button>
      </div>
      <p class="tip" data-i18n="editor.tip"></p>
      <div id="rows" class="rows"></div>
      <button id="addRowBtn" class="dashed" type="button" data-i18n="editor.addRow"></button>
    </section>

    <aside class="side">
      <div id="inspector" class="panel"></div>
    </aside>
  </div>

  <section class="preview">
    <div class="preview-label" data-i18n="editor.previewLabel"></div>
    <div id="preview" class="bubble-preview"></div>
  </section>

  <div id="status" class="status"></div>

  <script src="i18n.js"></script>
  <script src="bubble-model.js"></script>
  <script src="editor.js"></script>
</body>
</html>
