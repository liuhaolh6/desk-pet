<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title data-i18n="window.settings"></title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-icon" src="../assets/icon.png" alt="">
        <div class="brand-text">
          <h1 data-i18n="window.settings"></h1>
          <span id="version" class="muted"></span>
        </div>
      </div>

      <div class="search">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="settingSearch" type="search" autocomplete="off" spellcheck="false"
                 data-i18n-placeholder="settings.searchPlaceholder" data-i18n-aria-label="settings.searchAria"
                 aria-describedby="searchHint" aria-controls="searchResults" aria-expanded="false">
        </div>
        <p id="searchHint" class="search-hint" data-i18n="settings.searchHint"></p>
        <div id="searchResults" class="search-results" data-i18n-aria-label="settings.searchResultsAria" hidden></div>
      </div>

      <nav class="nav" data-i18n-aria-label="settings.navAria">
        <button type="button" class="nav-item active" data-panel="appearance"><span class="nav-icon">◐</span><span class="nav-label" data-i18n="panel.appearance.title"></span></button>
        <button type="button" class="nav-item" data-panel="role"><span class="nav-icon">◉</span><span class="nav-label" data-i18n="panel.role.title"></span></button>
        <button type="button" class="nav-item" data-panel="bubble"><span class="nav-icon">◌</span><span class="nav-label" data-i18n="panel.bubble.title"></span></button>
        <button type="button" class="nav-item" data-panel="reminder"><span class="nav-icon">◔</span><span class="nav-label" data-i18n="panel.reminder.title"></span></button>
        <button type="button" class="nav-item" data-panel="weather"><span class="nav-icon">☁</span><span class="nav-label" data-i18n="panel.weather.title"></span></button>
        <button type="button" class="nav-item" data-panel="sound"><span class="nav-icon">♪</span><span class="nav-label" data-i18n="panel.sound.title"></span></button>
        <button type="button" class="nav-item" data-panel="other"><span class="nav-icon">⚙</span><span class="nav-label" data-i18n="panel.other.title"></span></button>
      </nav>

      <div class="sidebar-foot">
        <span class="save-dot" aria-hidden="true"></span>
        <div class="save-copy">
          <div class="auto-save" data-i18n="settings.autoSave"></div>
          <div id="status" class="status" data-i18n="settings.statusDefault"></div>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="panelTitle"></h2>
          <p id="panelHint" class="panel-hint"></p>
        </div>
        <div class="topbar-actions">
          <span class="pill" data-i18n="settings.autoSave"></span>
          <div class="reset-wrap">
            <button id="resetPanelBtn" class="ghost-small" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n="settings.resetPanel"></button>
            <div id="resetConfirm" class="reset-confirm" role="alertdialog" aria-modal="false"
                 aria-labelledby="resetConfirmText" aria-describedby="resetConfirmHint" hidden>
              <p id="resetConfirmText" class="reset-title"><span data-i18n="settings.resetConfirmPrefix"></span><span id="resetPanelName"></span><span data-i18n="settings.resetConfirmSuffix"></span></p>
              <p id="resetConfirmHint" class="reset-hint" data-i18n="settings.resetConfirmHint"></p>
              <div class="reset-buttons">
                <button id="resetOk" class="danger-small" type="button" data-i18n="settings.resetConfirmOk"></button>
                <button id="resetCancel" type="button" data-i18n="settings.resetCancel"></button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="panels">
        <section class="panel active" data-panel="appearance">
          <div class="card">
            <div class="field">
              <label class="field-label" for="name" data-i18n="appearance.name"></label>
              <div class="field-body">
                <input id="name" type="text" maxlength="20" data-i18n-placeholder="appearance.namePlaceholder">
                <p class="field-hint" data-i18n="appearance.nameHint"></p>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="size" data-i18n="appearance.size"></label>
              <div class="field-body">
                <div class="control-line">
                  <input id="size" type="range" min="120" max="360" step="10">
                  <b id="sizeVal" class="value-pill">220px</b>
                </div>
                <p class="field-hint" data-i18n="appearance.sizeHint"></p>
              </div>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="appearance.place"></span>
              <div class="field-body stack">
                <label class="check-row"><input id="alwaysOnTop" type="checkbox"><span data-i18n="appearance.alwaysOnTop"></span><em data-i18n="appearance.alwaysOnTopHint"></em></label>
                <label class="check-row"><input id="autostart" type="checkbox"><span data-i18n="appearance.autostart"></span><em data-i18n="appearance.autostartHint"></em></label>
                <label class="check-row"><input id="snapEnabled" type="checkbox"><span data-i18n="appearance.snap"></span><em data-i18n="appearance.snapHint"></em></label>
                <label class="inline-row"><span data-i18n="appearance.snapGap"></span><input id="snapGap" type="number" min="0" max="80"><em data-i18n="appearance.snapGapUnit"></em></label>
              </div>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="role" hidden>
          <div class="card">
            <div class="card-head">
              <div>
                <h3 data-i18n="role.title"></h3>
                <p class="field-hint" data-i18n="role.hint"></p>
              </div>
              <span class="pill soft" data-i18n="role.resizePill"></span>
            </div>
            <div id="roles" class="roles"></div>
            <div class="button-row">
              <button id="importBtn" class="primary" type="button" data-i18n="role.import"></button>
              <button id="cutoutBtn" type="button" data-i18n="window.cutout"></button>
              <button id="resetPosBtn" type="button" data-i18n="role.resetPosition"></button>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="bubble" hidden>
          <div class="card">
            <div class="field">
              <label class="field-label" for="autoHide" data-i18n="bubble.autoHide"></label>
              <div class="field-body">
                <div class="control-line">
                  <input id="autoHide" type="number" min="0" max="120">
                  <span class="unit" data-i18n="bubble.seconds"></span>
                </div>
                <p class="field-hint" data-i18n="bubble.autoHideHint"></p>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="cooldown" data-i18n="bubble.cooldown"></label>
              <div class="field-body">
                <div class="control-line">
                  <input id="cooldown" type="number" min="0" max="240">
                  <span class="unit" data-i18n="bubble.minutes"></span>
                </div>
                <p class="field-hint" data-i18n="bubble.cooldownHint"></p>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="phrases" data-i18n="bubble.phrases"></label>
              <div class="field-body">
                <textarea id="phrases" rows="4" data-i18n-placeholder="bubble.phrasesPlaceholder"></textarea>
                <p class="field-hint" data-i18n="bubble.phrasesHint"></p>
              </div>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="bubble.style"></span>
              <div class="field-body">
                <button id="editorBtn" class="primary" type="button" data-i18n="bubble.edit"></button>
                <p class="field-hint" data-i18n="bubble.styleHint"></p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="reminder" hidden>
          <div class="card">
            <div class="field">
              <label class="field-label" for="mode" data-i18n="reminder.mode"></label>
              <div class="field-body">
                <select id="mode">
                  <option value="quiet" data-i18n="reminder.modeQuiet"></option>
                  <option value="normal" data-i18n="reminder.modeNormal"></option>
                  <option value="chatty" data-i18n="reminder.modeChatty"></option>
                </select>
                <p class="field-hint" data-i18n="reminder.modeHint"></p>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="interval" data-i18n="reminder.interval"></label>
              <div class="field-body">
                <select id="interval">
                  <option value="30" data-i18n="reminder.interval30"></option>
                  <option value="45" data-i18n="reminder.interval45"></option>
                  <option value="60" data-i18n="reminder.interval60"></option>
                  <option value="90" data-i18n="reminder.interval90"></option>
                  <option value="120" data-i18n="reminder.interval120"></option>
                </select>
                <p class="field-hint" data-i18n="reminder.intervalHint"></p>
              </div>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="reminder.quiet"></span>
              <div class="field-body">
                <div class="control-line">
                  <input id="quietFrom" type="number" min="0" max="23" data-i18n-aria-label="reminder.quietFromAria">
                  <span class="unit" data-i18n="reminder.quietFromUnit"></span>
                  <input id="quietTo" type="number" min="0" max="23" data-i18n-aria-label="reminder.quietToAria">
                  <span class="unit" data-i18n="reminder.quietToUnit"></span>
                </div>
                <p class="field-hint" data-i18n="reminder.quietHint"></p>
              </div>
            </div>
          </div>

          <div class="card">
            <h3 data-i18n="reminder.nudgeTitle"></h3>
            <div class="field">
              <span class="field-label" data-i18n="reminder.nudgeWhen"></span>
              <div class="field-body stack">
                <label class="check-row"><input id="nudgeEnabled" type="checkbox"><span data-i18n="reminder.nudgeEnabled"></span><em data-i18n="reminder.nudgeEnabledHint"></em></label>
                <label class="check-row"><input id="nudgeLongUse" type="checkbox"><span data-i18n="reminder.nudgeLongUse"></span><em data-i18n="reminder.nudgeLongUseHint"></em></label>
                <label class="check-row"><input id="nudgeLateNight" type="checkbox"><span data-i18n="reminder.nudgeLateNight"></span><em data-i18n="reminder.nudgeLateNightHint"></em></label>
                <label class="check-row"><input id="nudgeAway" type="checkbox"><span data-i18n="reminder.nudgeAway"></span><em data-i18n="reminder.nudgeAwayHint"></em></label>
              </div>
              <p class="field-hint" data-i18n="reminder.nudgeHint"></p>
            </div>
          </div>

          <div class="card">
            <h3 data-i18n="reminder.waterTitle"></h3>
            <div class="field">
              <span class="field-label" id="waterTodayLabel" data-i18n="reminder.today"></span>
              <div class="field-body">
                <p id="waterToday" class="field-hint" data-i18n="reminder.waterTodayEmpty"></p>
                <ol id="waterTimeline" class="water-timeline" aria-labelledby="waterTodayLabel"></ol>
              </div>
            </div>
            <div class="field">
              <span class="field-label" id="waterWeekLabel" data-i18n="reminder.week"></span>
              <div class="field-body">
                <p class="field-hint" data-i18n="reminder.weekHint"></p>
                <ul id="waterWeek" class="water-week" aria-labelledby="waterWeekLabel"></ul>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="cupMl" data-i18n="reminder.cupMl"></label>
              <div class="field-body">
                <div class="control-line">
                  <input id="cupMl" type="number" min="50" max="1000" step="10" aria-describedby="cupMlHint">
                  <span class="unit" data-i18n="reminder.ml"></span>
                </div>
                <p id="cupMlHint" class="field-hint" data-i18n="reminder.cupMlHint"></p>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="reminder.export"></span>
              <div class="field-body">
                <div class="control-line">
                  <button id="exportWaterBtn" type="button" class="ghost-small" data-i18n="reminder.exportCsv"></button>
                </div>
                <p id="waterExportHint" class="field-hint" data-i18n="reminder.exportHint"></p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="weather" hidden>
          <div class="card">
            <div class="field">
              <label class="field-label" for="city" data-i18n="weather.city"></label>
              <div class="field-body">
                <div class="control-line">
                  <input id="city" type="text" data-i18n-placeholder="weather.cityPlaceholder">
                  <button id="searchBtn" type="button" data-i18n="weather.search"></button>
                  <button id="locateBtn" type="button" data-i18n="weather.locate"></button>
                </div>
                <div id="recentCities" class="chips-inline recent-cities" data-i18n-aria-label="weather.recentAria" hidden></div>
                <div id="results" class="results" hidden></div>
                <p id="cityNow" class="field-hint"></p>
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="refreshMinutes" data-i18n="weather.refresh"></label>
              <div class="field-body">
                <select id="refreshMinutes">
                  <option value="5" data-i18n="weather.refresh5"></option>
                  <option value="15" data-i18n="weather.refresh15"></option>
                  <option value="30" data-i18n="weather.refresh30"></option>
                  <option value="60" data-i18n="weather.refresh60"></option>
                </select>
                <p class="field-hint" data-i18n="weather.refreshHint"></p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="sound" hidden>
          <div class="card">
            <div class="field">
              <span class="field-label" data-i18n="sound.enabled"></span>
              <div class="field-body stack">
                <label class="check-row"><input id="sound" type="checkbox"><span data-i18n="sound.enable"></span><em data-i18n="sound.enableHint"></em></label>
                <div class="control-line">
                  <span class="inline-label" data-i18n="sound.volume"></span>
                  <input id="soundVolume" type="range" min="0" max="100" step="5" data-i18n-aria-label="sound.volume">
                  <b id="soundVolumeVal" class="value-pill">45%</b>
                </div>
              </div>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="sound.events"></span>
              <div class="field-body">
                <div id="soundEvents" class="sound-events"></div>
                <p class="field-hint" data-i18n="sound.eventsHint"></p>
              </div>
            </div>

            <div class="field">
              <span class="field-label" data-i18n="sound.files"></span>
              <div class="field-body">
                <div id="soundFiles" class="chips-inline"></div>
                <button id="soundImportBtn" type="button" data-i18n="sound.import"></button>
                <p class="field-hint" data-i18n="sound.filesHint"></p>
              </div>
            </div>
          </div>
        </section>

        <section class="panel" data-panel="other" hidden>
          <div class="card">
            <div class="field">
              <span class="field-label" data-i18n="other.locale"></span>
              <div class="field-body">
                <div class="control-line">
                  <select id="localeSelect" data-i18n-aria-label="other.locale" aria-describedby="localeHint">
                    <option value="" data-i18n="other.localeSystem"></option>
                    <option value="zh-CN" data-i18n="other.localeZh"></option>
                    <option value="en-US" data-i18n="other.localeEn"></option>
                  </select>
                </div>
                <p class="field-hint" id="localeHint"><span data-i18n="other.localeHintPrefix"></span><span id="localeNow">—</span></p>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="other.dataDir"></span>
              <div class="field-body">
                <div class="control-line">
                  <code id="dataDir" class="path"></code>
                  <button id="openDirBtn" type="button" data-i18n="other.openDir"></button>
                </div>
                <p class="field-hint" data-i18n="other.dataDirHint"></p>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="other.onboard"></span>
              <div class="field-body">
                <button id="onboardBtn" type="button" data-i18n="other.onboardBtn"></button>
                <p class="field-hint" data-i18n="other.onboardHint"></p>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="other.tray"></span>
              <div class="field-body">
                <p id="trayStatus" class="field-hint" data-i18n="other.trayChecking"></p>
                <p id="shortcutStatus" class="field-hint" data-i18n="other.shortcutChecking"></p>
                <p class="field-hint" data-i18n="other.trayHint"></p>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="other.trouble"></span>
              <div class="field-body">
                <button id="diagBtn" type="button" data-i18n="other.diagnostics"></button>
                <p id="diagStatus" class="field-hint" data-i18n="other.diagHint"></p>
              </div>
            </div>
            <div class="field wide">
              <span class="field-label" data-i18n="other.privacy"></span>
              <div class="field-body">
                <details id="privacyBox" class="privacy-box">
                  <summary data-i18n="other.privacySummary"></summary>
                  <ul class="privacy-list">
                    <li><span data-i18n="other.privacySettings"></span><code>settings.json</code> <span id="privSettings" class="privacy-size">…</span></li>
                    <li><span data-i18n="other.privacyPhotos"></span><code>photos/</code> <span id="privPhotos" class="privacy-size">…</span></li>
                    <li><span data-i18n="other.privacyLogs"></span><code>app.log</code><span data-i18n="other.listSeparator"></span><code>cutout-trace.jsonl</code> <span id="privLogs" class="privacy-size">…</span></li>
                    <li><span data-i18n="other.privacyCaches"></span><span id="privCaches" class="privacy-size">…</span></li>
                  </ul>
                  <p class="field-hint" data-i18n="other.privacyBody"></p>
                  <div class="control-line">
                    <button id="privacyCleanBtn" type="button" class="danger-small" data-i18n="other.cleanup" data-i18n-aria-label="other.cleanup"></button>
                    <button id="privacyConfirmBtn" type="button" class="danger-small" data-i18n="other.cleanupConfirm" data-i18n-aria-label="other.cleanupConfirmAria" hidden></button>
                    <button id="privacyCancelBtn" type="button" class="ghost-small" data-i18n="other.cleanupCancel" data-i18n-aria-label="other.cleanupCancelAria" hidden></button>
                  </div>
                  <p id="privacyStatus" class="field-hint"></p>
                </details>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="other.update"></span>
              <div class="field-body">
                <button id="updateBtn" type="button" data-i18n="other.updateBtn"></button>
                <p id="updateStatus" class="field-hint" data-i18n="other.updateHint"></p>
                <label class="check-row"><input id="updateBootToggle" type="checkbox" data-i18n-aria-label="other.updateBootAria"><span data-i18n="other.updateBoot"></span><em data-i18n="other.updateBootHint"></em></label>
              </div>
            </div>
            <div class="field">
              <span class="field-label" data-i18n="other.quit"></span>
              <div class="field-body">
                <button id="quitBtn" type="button" class="danger" data-i18n="other.quitBtn"></button>
                <p class="field-hint" data-i18n="other.quitHint"></p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="i18n.js"></script>
  <script src="sound-model.js"></script>
  <script src="settings.js"></script>
</body>
</html>
