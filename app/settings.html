<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌宠设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <h1>桌宠设置</h1>
    <span id="version" class="muted"></span>
  </header>

  <main>
    <section>
      <h2>外观</h2>
      <label class="row">
        <span>名字</span>
        <input id="name" type="text" maxlength="20" placeholder="小芳桌宠">
      </label>
      <label class="row">
        <span>大小</span>
        <input id="size" type="range" min="120" max="360" step="10">
        <b id="sizeVal" class="val">220px</b>
      </label>
      <label class="row check">
        <input id="alwaysOnTop" type="checkbox">
        <span>总在最前</span>
      </label>
      <label class="row check">
        <input id="autostart" type="checkbox">
        <span>开机自启</span>
      </label>
    </section>

    <section>
      <h2>模式</h2>
      <label class="row">
        <span>提醒强度</span>
        <select id="mode">
          <option value="quiet">安静（不提醒）</option>
          <option value="normal">正常</option>
          <option value="chatty">话痨</option>
        </select>
      </label>
    </section>

    <section>
      <h2>天气</h2>
      <div class="row">
        <span>城市</span>
        <input id="city" type="text" placeholder="输入城市名后点搜索">
        <button id="searchBtn" type="button">搜索</button>
        <button id="locateBtn" type="button">定位</button>
      </div>
      <div id="results" class="results" hidden></div>
      <label class="row">
        <span>刷新</span>
        <select id="refreshMinutes">
          <option value="5">每 5 分钟</option>
          <option value="15">每 15 分钟</option>
          <option value="30">每 30 分钟</option>
          <option value="60">每 60 分钟</option>
        </select>
      </label>
    </section>

    <section>
      <h2>喝水提醒</h2>
      <label class="row">
        <span>间隔</span>
        <select id="interval">
          <option value="30">每 30 分钟</option>
          <option value="45">每 45 分钟</option>
          <option value="60">每 60 分钟</option>
          <option value="90">每 90 分钟</option>
          <option value="120">每 120 分钟</option>
        </select>
      </label>
      <div class="row">
        <span>免打扰</span>
        <input id="quietFrom" type="number" min="0" max="23">
        <em>点到</em>
        <input id="quietTo" type="number" min="0" max="23">
        <em>点</em>
      </div>
    </section>

    <section>
      <h2>气泡</h2>
      <div class="row">
        <span>自动收起</span>
        <input id="autoHide" type="number" min="0" max="120">
        <em>秒（0 为不收起）</em>
      </div>
      <div class="row">
        <span>天气冷却</span>
        <input id="cooldown" type="number" min="0" max="240">
        <em>分钟</em>
      </div>
      <label class="col">
        <span>温馨语句（每行一条）</span>
        <textarea id="phrases" rows="4"></textarea>
      </label>
      <label class="row check">
        <input id="sound" type="checkbox">
        <span>交互音效</span>
      </label>
      <div class="row">
        <button id="editorBtn" class="primary" type="button">编辑气泡…</button>
        <span class="muted">自定义每张卡的行、模块与样式</span>
      </div>
    </section>

    <section>
      <h2>角色</h2>
      <div id="roles" class="roles"></div>
      <div class="row">
        <button id="importBtn" class="primary" type="button">导入图片做角色</button>
        <button id="resetPosBtn" type="button">回到右下角</button>
      </div>
    </section>

    <section>
      <h2>其他</h2>
      <div class="row">
        <span>数据目录</span>
        <code id="dataDir" class="path"></code>
        <button id="openDirBtn" type="button">打开</button>
      </div>
      <div class="row">
        <button id="quitBtn" type="button">退出桌宠</button>
        <span id="status" class="muted"></span>
      </div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
