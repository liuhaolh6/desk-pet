<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title data-i18n="onboard.title"></title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="onboard.css">
</head>
<body>
  <main class="card" role="dialog" aria-modal="true" aria-labelledby="obTitle" aria-describedby="obLead">
    <header class="hero">
      <img class="hero-icon" src="../assets/icon.png" alt="">
      <div class="hero-text">
        <h1 id="obTitle"><span data-i18n="onboard.greet"></span><span id="obName"></span></h1>
        <p id="obLead" class="lead" data-i18n="onboard.lead"></p>
      </div>
    </header>

    <ol class="steps">
      <li class="step">
        <span class="step-no" aria-hidden="true">1</span>
        <div class="step-text">
          <p class="step-title" data-i18n="onboard.step1.title"></p>
          <p class="step-body" data-i18n="onboard.step1.body"></p>
        </div>
      </li>
      <li class="step">
        <span class="step-no" aria-hidden="true">2</span>
        <div class="step-text">
          <p class="step-title" data-i18n="onboard.step2.title"></p>
          <p class="step-body" data-i18n="onboard.step2.body"></p>
        </div>
      </li>
      <li class="step">
        <span class="step-no" aria-hidden="true">3</span>
        <div class="step-text">
          <p class="step-title" data-i18n="onboard.step3.title"></p>
          <p class="step-body" data-i18n="onboard.step3.body"></p>
        </div>
      </li>
    </ol>

    <footer class="actions">
      <p class="foot-note" data-i18n="onboard.foot"></p>
      <div class="buttons">
        <button id="settingsBtn" class="ghost" type="button" data-i18n="onboard.settingsBtn"></button>
        <button id="doneBtn" class="primary" type="button" autofocus data-i18n="onboard.doneBtn"></button>
      </div>
    </footer>
  </main>
  <script src="i18n.js"></script>
  <script src="onboard.js"></script>
  <script src="theme-boot.js"></script>
</body>
</html>
